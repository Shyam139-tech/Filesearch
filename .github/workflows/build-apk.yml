name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

     
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK tools and accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK target SDK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$AAPT" dump badging "$APK" | grep -E "sdkVersion|targetSdkVersion"

          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'35'" || {
            echo "ERROR: APK does not target SDK 35."
            exit 1
          }

          echo "SUCCESS: APK targets SDK 35."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileSearchEngine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
